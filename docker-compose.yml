name: coffee-order

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: coffee-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: coffee_os
      MYSQL_USER: coffee
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-coffee123}
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=768M
      - --max-connections=100
    mem_limit: 1536m
    cpus: 1.5
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 5s
      timeout: 3s
      retries: 30

  server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: coffee-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://coffee:${MYSQL_PASSWORD:-coffee123}@mysql:3306/coffee_os
      JWT_SECRET: ${JWT_SECRET:-please-change-me-in-production}
      PORT: 3000
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost}
      MOCK_PAYMENT: ${MOCK_PAYMENT:-false}
      PRINTER_ENABLED: ${PRINTER_ENABLED:-false}
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-false}
      API_RATE_LIMIT: ${API_RATE_LIMIT:-300}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      WECHAT_API_V3_KEY: ${WECHAT_API_V3_KEY:-}
      WECHAT_PLATFORM_CERT_PATH: ${WECHAT_PLATFORM_CERT_PATH:-}
      WECHAT_MP_APPID: ${WECHAT_MP_APPID:-}
      WECHAT_MP_SECRET: ${WECHAT_MP_SECRET:-}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID:-}
      WECHAT_MCH_SERIAL: ${WECHAT_MCH_SERIAL:-}
      WECHAT_MCH_PRIVATE_KEY_PATH: ${WECHAT_MCH_PRIVATE_KEY_PATH:-}
      WECHAT_SUBSCRIBE_TEMPLATE_READY: ${WECHAT_SUBSCRIBE_TEMPLATE_READY:-}
    volumes:
      - uploads:/app/uploads
      - ./secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
    expose:
      - "3000"
    mem_limit: 768m
    cpus: 1.0
    logging: *default-logging

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    container_name: coffee-web
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      # 方案B：仅绑定宿主机内网端口，对外由宿主机 Nginx 网关按域名转发
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 128m
    cpus: 0.25
    logging: *default-logging

volumes:
  mysql_data:
  uploads:
