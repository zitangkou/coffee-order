# Coffee OS H5 + API 反向代理示例
# 请将 coffee.example.com 替换为实际域名，并配置 SSL 证书

server {
    listen 80;
    server_name coffee.example.com;

    # H5 前端静态资源（uni-app build:h5 产物）
    root /var/www/coffee/web/dist/build/h5;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 上传文件（桌码图片等）
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
    }
}
