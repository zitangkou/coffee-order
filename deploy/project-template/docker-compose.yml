name: project-b

services:
  app:
    build: ./app
    container_name: project-b-app
    restart: unless-stopped
    ports:
      # 方案B：仅绑定宿主机内网端口，对外由 Nginx 网关按域名转发
      - "127.0.0.1:${APP_PORT:-8081}:80"
    environment:
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-project_b}
      DB_USER: ${DB_USER:-project_b}
      DB_PASSWORD: ${MYSQL_PASSWORD:-change-me}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: project-b-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
      MYSQL_DATABASE: ${DB_NAME:-project_b}
      MYSQL_USER: ${DB_USER:-project_b}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me}
    volumes:
      - project_b_mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD:-change-me}"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  project_b_mysql_data:
